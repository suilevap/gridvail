name: Web build

# main's build is served at the site root, and each pull request from this
# repository gets its own preview under pr/<number>/, linked in a comment and
# removed when the pull request closes. Both live in the gh-pages branch,
# which GitHub Pages serves (Settings → Pages → Deploy from a branch).
#
# Previews are built from the branch's own commit. Plain pull_request events
# would build GitHub's trial merge with main instead, and GitHub runs nothing
# at all for a pull request with merge conflicts. pull_request_target needs
# no trial merge (it runs main's copy of this workflow), so it drives
# previews: opening, every push to the branch, reopening and closing. Only
# branches with a pull request run anything; plain pushes build only main.
#
# Changes that cannot alter the game (docs, tests, tools) build nothing, and
# a pull request labelled no-preview skips its build too.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tests/**'
      - 'tools/**'
      - '.claude/**'
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - '**.md'
      - 'tests/**'
      - 'tools/**'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch, whichever event started it; a newer one cancels it.
  group: web-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dest: ${{ steps.target.outputs.dest }}
      sha: ${{ steps.target.outputs.sha }}
      pr: ${{ steps.target.outputs.pr }}
      remove: ${{ steps.target.outputs.remove }}
    steps:
      # main's copy for pull requests and pushes; only the script is used.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: target
        uses: actions/github-script@v7
        with:
          script: |
            const target = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-target.js`);
            await target({ context, core });

  build:
    needs: target
    if: needs.target.outputs.dest != ''
    runs-on: ubuntu-latest
    # Runs the branch's code (build.rs, cargo), so it gets no write access.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test URL launch options
        run: node --test web/options.test.mjs
      - name: Install Rust (rust-toolchain.toml) with the wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # pull_request_target saves under main's cache scope; keep branch
          # builds from writing there.
          save-if: ${{ github.event_name != 'pull_request_target' }}
      - name: Build
        run: cargo build --profile web --target wasm32-unknown-unknown
      - name: Install wasm-bindgen (must match Cargo.lock)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Generate bindings
        run: |
          wasm-bindgen --no-typescript --target web --out-dir dist --out-name gridvail \
            target/wasm32-unknown-unknown/web/pav_ecs_game_bevy_port.wasm
      - name: Shrink with wasm-opt
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz
          ./binaryen-version_123/bin/wasm-opt -Oz --all-features -o dist/gridvail_bg.wasm dist/gridvail_bg.wasm
      - name: Assemble site
        env:
          PR_NUMBER: ${{ needs.target.outputs.pr }}
          BUILD_SHA: ${{ needs.target.outputs.sha }}
        run: |
          # Stamp the page with the commit and build time shown in its corner;
          # a preview names its pull request too.
          label=${BUILD_SHA::7}
          if [ -n "$PR_NUMBER" ]; then label="PR #$PR_NUMBER · $label"; fi
          sed -e "s/__BUILD_SHA__/$label/" \
              -e "s/__BUILD_TIME__/$(date -u '+%Y-%m-%d %H:%M UTC')/" \
              web/index.html > dist/index.html
          mkdir -p dist/assets && cp -r assets/shaders dist/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3

  publish:
    needs: [target, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Default checkout (main for pull_request_target), for the scripts only;
      # nothing from the built branch runs here. Not sparse: publish-pages.sh
      # stages the whole site through this repository's index.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Publish to gh-pages
        env:
          DEST: ${{ needs.target.outputs.dest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/publish-pages.sh "$DEST" "$RUNNER_TEMP/site"
      - name: Link the preview from the pull request
        if: needs.target.outputs.pr != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.target.outputs.pr }}
          BUILD_SHA: ${{ needs.target.outputs.sha }}
        with:
          script: |
            const comment = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-comment.js`);
            const { owner, repo } = context.repo;
            const pr = Number(process.env.PR_NUMBER);
            const url = `https://${owner}.github.io/${repo}/pr/${pr}/`;
            await comment({ github, context }, pr,
              `**Web preview:** ${url}\n\n` +
              `Built from the branch at ${process.env.BUILD_SHA.slice(0, 7)} (not merged ` +
              `with main); updated on every push and removed when this pull request ` +
              `closes. GitHub Pages can take a minute after this comment to serve it.`);

  remove-preview:
    needs: target
    if: needs.target.outputs.remove == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove the preview from gh-pages
        env:
          PR_NUMBER: ${{ needs.target.outputs.pr }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/publish-pages.sh "pr/$PR_NUMBER"
      - name: Note the removal on the pull request
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.target.outputs.pr }}
        with:
          script: |
            const comment = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-comment.js`);
            await comment({ github, context }, Number(process.env.PR_NUMBER),
              '**Web preview:** removed now that this pull request is closed.');
