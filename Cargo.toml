[package]
name = "pav_ecs_game_bevy_port"
version = "0.1.0"
edition = "2021"
description = "Bevy Rust port of PavEcsGame (C# LeoECSLite console roguelike)"
license = "MIT"
# flatbt-bevy's minimum.
rust-version = "1.95"

[dependencies]
bevy = { version = "0.19.1", features = ["bevy_remote"] }
rand = "0.10"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Enemy behavior trees. Unpublished; tracks the FlatBT repository.
# TODO: back to `branch = "main"` once the allocation-free tick lands there.
flatbt-bevy = { git = "https://github.com/suilevap/flatbt", branch = "claude/flatbt-gridveil-integration-jb49ew" }
