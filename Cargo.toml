[package]
name = "pav_ecs_game_bevy_port"
version = "0.1.0"
edition = "2021"
description = "Bevy Rust port of PavEcsGame (C# LeoECSLite console roguelike)"
license = "MIT"
# flatbt-bevy's minimum.
rust-version = "1.95"

[workspace]
members = ["crates/gridvail-path"]

[dependencies]
bevy = { version = "0.19.1", features = ["bevy_remote"] }
rand = "0.10"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gridvail-path = { path = "crates/gridvail-path" }
# Enemy behavior trees. Unpublished; tracks the FlatBT repository.
flatbt-bevy = { git = "https://github.com/suilevap/flatbt", branch = "main" }
# For `goal_match!`, which the Bevy prelude does not re-export.
flatbt = { git = "https://github.com/suilevap/flatbt", branch = "main" }

# The browser build: rand's OS entropy comes from the JS crypto API there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# `cargo build --profile web --target wasm32-unknown-unknown`: small download.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

