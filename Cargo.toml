[package]
name = "pav_ecs_game_bevy_port"
version = "0.1.0"
edition = "2021"
description = "Bevy Rust port of PavEcsGame (C# LeoECSLite console roguelike)"
license = "MIT"
# flatbt-bevy's minimum.
rust-version = "1.95"

[workspace]
members = ["crates/gridvail-path"]

[dependencies]
# Only the Bevy parts the game uses, so the web download stays small: no
# audio, glTF, scenes, picking, gizmos, animation clips, gamepads or extra
# image codecs. Desktop-only parts are added below.
bevy = { version = "0.19.1", default-features = false, features = [
    # App, windowing and input. Bevy's "default_app" minus its state machine
    # and reflection auto-registration, which the game does not use.
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "std",
    "multi_threaded",
    "bevy_winit",
    "webgl2",
    "keyboard",
    "mouse",
    "touch",
    # Rendering: the text map (Text2d) and the HUD (UI).
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_text",
    "default_font",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_sprite_render",
] }
rand = "0.10"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The rules files' format. Bevy's asset crate already uses it, so it adds
# nothing to the web download.
ron = "0.12"
# Rasterizes the cell font's glyphs for the wall shader; Bevy's text uses it
# too, so it adds nothing to the download.
swash = "0.2"
gridvail-path = { path = "crates/gridvail-path" }
# Enemy behavior trees. Unpublished; tracks the FlatBT repository.
flatbt-bevy = { git = "https://github.com/suilevap/flatbt", branch = "main" }
# For `goal_match!`, which the Bevy prelude does not re-export.
flatbt = { git = "https://github.com/suilevap/flatbt", branch = "main" }

# Desktop only: the 3D walls renderer (and the lookup tables its camera
# tonemaps with), the agent API's HTTP server, system diagnostics, PNG
# saving for `--screenshot` and `--record`, and the Linux window backends.
# The web build leaves them out.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "x11",
    "wayland",
    "bevy_pbr",
    "tonemapping_luts",
    "zstd_rust",
    "bevy_remote",
    "sysinfo_plugin",
    "png",
    # The agent API's standard Bevy Remote methods read the type registry.
    "reflect_auto_register",
] }

# The browser build: rand's OS entropy comes from the JS crypto API there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# Optimized browser builds compile debug and trace logging out entirely;
# warnings and errors still reach the console.
tracing = { version = "0.1", default-features = false, features = ["release_max_level_warn"] }
log = { version = "0.4", default-features = false, features = ["release_max_level_warn"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# `cargo build --profile web --target wasm32-unknown-unknown`: small download.
[profile.web]
inherits = "release"
# "z" over "s": 18% less to download and 38% less wasm for the browser to
# compile, with no frame-time difference measured in the browser.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
